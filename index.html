<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>wolf.</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="scene" aria-label="Immersive profile landing page inspired by a dark cozy room">
      <div class="grain" aria-hidden="true"></div>
      <div class="embers" aria-hidden="true"></div>

      <section class="profile-card" aria-label="Profile card">
        <div class="top-row">
          <div class="avatar" aria-label="Cat avatar wearing a black hat">
            <div class="cat-face">
              <span class="ear left"></span>
              <span class="ear right"></span>
              <span class="eye left"></span>
              <span class="eye right"></span>
              <span class="nose"></span>
              <span class="whiskers"></span>
              <span class="hat"></span>
            </div>
          </div>

          <div class="identity">
            <div class="name-line">
              <h1>wolf.</h1>
              <div class="badges" aria-label="profile badges">
                <span>♛</span>
                <span>♦</span>
                <span>&lt;/&gt;</span>
                <span>🛠</span>
                <span>🦊</span>
              </div>
            </div>
            <p>local time: <strong id="clock">--:--:-- --</strong></p>
            <p class="tagline">love yall.</p>
          </div>

          <aside class="discord" aria-label="Discord profile status">
            <div class="mini-avatar" aria-hidden="true">☄</div>
            <div>
              <p class="status-label">DISCORD PROFILE • OFFLINE</p>
              <strong>cosmic.</strong>
              <span>offline</span>
            </div>
          </aside>

          <button class="more" type="button">More</button>
        </div>

        <div class="divider"></div>

        <div class="actions" aria-label="social links">
          <a href="#" aria-label="Square profile link">▣</a>
          <a href="#" aria-label="Spotify profile link">◉</a>
          <a href="#" aria-label="TikTok profile link">♪</a>
        </div>

        <div class="views" aria-label="view count">◉ 192,729</div>
      </section>

      <div class="control-pills" aria-label="media controls">
        <span class="active-indicator"></span>
        <div class="controls">
          <span>♩</span>
          <input type="range" aria-label="volume" value="22" />
          <span>⊙</span>
          <input type="range" aria-label="ambience" value="58" />
        </div>
      </div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
